# Keeps the free Supabase project awake: a real request (function + database read)
# every two days. Free projects pause after 7 days without activity.
name: keepalive
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (public catalog)
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_zmdgfhVf1AUZart717F0zQ_9XZnmCNw' \
            -d '{}' https://kahsdittkaascnrfamlv.supabase.co/functions/v1/public-config)
          echo "status $code"; head -c 200 /tmp/r.json; echo
          test "$code" = "200"
      - name: Ping site
        run: curl -sS -o /dev/null -w 'site %{http_code}\n' https://lamsa-eg.github.io/
