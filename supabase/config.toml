# Supabase CLI config for LAMSA. `supabase link --project-ref <ref>` then `supabase db push` and `supabase functions deploy`.
project_id = "lamsa"

# All functions are reached through the Cloudflare Worker with the publishable key (not a JWT).
# Each function checks its own authorization: tracking token, gateway secret, or admin JWT via actor().
[functions.abort-order]
verify_jwt = false

