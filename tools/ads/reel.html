<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>LAMSA reel</title>
<link rel="stylesheet" href="/assets/css/lamsa-ds.css">
<style>
/* 15s vertical reel (1080x1920). Frames are captured by tools/ads/reel.mjs by seeking the CSS animations. */
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:var(--l-font);background:#0c1626}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;padding:300px 80px 380px;text-align:center;opacity:0;animation:sc 3s linear both}
.night{background:var(--l-sky);color:#fff}.sand{background:radial-gradient(120% 80% at 50% 0%,#fff8ea 0%,#f6e9d0 60%,#f1dcbb 100%);color:#13233b}
.s1{animation-delay:0s}.s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}.s5{animation-delay:12s;animation-name:scEnd}
@keyframes sc{0%{opacity:0}8%{opacity:1}92%{opacity:1}100%{opacity:0}}
@keyframes scEnd{0%{opacity:0}8%{opacity:1}100%{opacity:1}}
h1{color:inherit;font-family:var(--l-display);font-size:118px;line-height:1.3;margin:0}
h1 em{font-style:normal;display:block;color:#f6c177}.sand h1 em{color:#c7432a}
p{font-size:44px;line-height:1.6;margin:0;opacity:.92}
.up{opacity:0;animation:up .7s var(--l-ease) both}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .7s var(--l-ease) both}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.arch{width:640px;aspect-ratio:4/5;border-radius:999px 999px 40px 40px;overflow:hidden;border:10px solid rgba(246,193,119,.5);box-shadow:0 40px 100px rgba(12,22,38,.5);position:relative;background:#13233b}
.arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.round{width:760px;aspect-ratio:1;border-radius:60px;overflow:hidden;border:8px solid #fff;box-shadow:0 40px 100px rgba(19,35,59,.25)}
.round img{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 3s linear both;animation-delay:3s}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
.phone{width:600px;background:var(--l-sky);border-radius:70px;border:14px solid #13233b;box-shadow:0 40px 100px rgba(19,35,59,.3);padding:90px 44px;display:flex;flex-direction:column;gap:34px;color:#fff}
.phone small{color:#f6c177;font-size:32px}.phone .q{font-family:var(--l-display);font-size:66px;line-height:1.35}
.phone .o{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.phone .o span{background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.25);border-radius:30px;padding:30px 0;font-size:44px;font-weight:600}
.phone .o .y{animation:pick .5s ease both;animation-delay:7.6s}
@keyframes pick{from{background:rgba(255,255,255,.12);color:#fff}to{background:#f6c177;color:#13233b;border-color:transparent;transform:scale(1.06)}}
.phone .r{font-size:36px;color:#f6d9b0}
.x2{animation:fadeIn .8s ease both;animation-delay:10.4s;opacity:0}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.brand{font-family:var(--l-display);font-size:200px;line-height:1;display:flex;align-items:center;gap:30px}.brand i{font-style:normal;color:#f6c177;font-size:130px}
.cta{background:linear-gradient(135deg,#f6c177,#f08a5d);color:#13233b;font-weight:700;font-size:56px;padding:34px 70px;border-radius:999px;box-shadow:0 20px 50px rgba(12,22,38,.35)}
.price{font-size:40px}.price b{font-size:64px}
.url{font-size:38px;direction:ltr;opacity:.85}
</style></head><body>
<section class="sc night s1"><h1><span class="up" style="animation-delay:.3s;display:block">مش صفحة صور…</span><em class="up" style="animation-delay:1.2s">دي رحلة من قصتكم.</em></h1><div class="arch pop" style="animation-delay:.6s"><img src="/assets/img/scene-gift.svg" alt=""></div></section>
<section class="sc sand s2"><h1><span class="up" style="animation-delay:3.3s;display:block">قرّب الموبايل…</span><em class="up" style="animation-delay:4.1s">والحكاية تفتح.</em></h1><div class="round pop" style="animation-delay:3.3s"><img src="/assets/img/scene-tap.svg" alt=""></div><p class="up" style="animation-delay:4.6s">NFC أو QR — من غير أي تطبيق</p></section>
<section class="sc sand s3"><h1 class="up" style="animation-delay:6.3s">ألعاب من <em style="display:inline">تفاصيلكم إنتو</em></h1><div class="phone pop" style="animation-delay:6.5s"><small>✦ لعبة «مين فينا؟»</small><div class="q">مين اللي بيتأخر أكتر؟</div><div class="o"><span>آدم</span><span class="y">ليلى ✓</span></div><div class="r up" style="animation-delay:8s">«ربع ساعة بالظبط» ♡</div></div></section>
<section class="sc night s4"><div class="arch pop" style="animation-delay:9.2s"><img src="/assets/demo-v2/coffee.svg" alt=""><img class="x2" src="/assets/demo-v2/birthday.svg" alt=""></div><h1 class="up" style="animation-delay:9.5s">صوركم · رسايلكم<em>وأغنيتكم</em></h1></section>
<section class="sc night s5"><div class="brand pop" style="animation-delay:12.2s"><i>✦</i>لمسة</div><p class="up" style="animation-delay:12.6s">هدية تتلمس، وذكرى تفتح بلمسة</p><span class="cta pop" style="animation-delay:13s">ابدأ حكايتكم ←</span><div class="price up" id="price" style="animation-delay:13.4s"></div><div class="url up" style="animation-delay:13.6s">lamsa-eg.github.io</div></section>
<script src="/tools/ads/reel.js"></script></body></html>
