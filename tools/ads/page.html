<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>LAMSA page assets</title>
<link rel="stylesheet" href="/assets/css/lamsa-ds.css">
<style>
/* Facebook/Instagram page assets: ?k=avatar (1080x1080, safe inside the circle crop) | ?k=cover (1640x720, key content inside the centre so phones don't crop it). */
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;font-family:var(--l-font);background:var(--l-sky);color:#fff}
.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1.5px,transparent 2px),radial-gradient(circle,#f6c177 0 2px,transparent 2.5px);background-size:230px 190px,370px 290px;background-position:20px 30px,120px 80px;opacity:.5;mask-image:linear-gradient(#000 0,#000 50%,transparent 75%)}
.avatar{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.avatar i{font-style:normal;display:block;color:#f6c177;font-size:150px;line-height:1}
.avatar b{display:block;font-family:var(--l-display);font-size:330px;line-height:1.05;margin-top:-10px}
.avatar small{display:block;letter-spacing:.42em;font-size:54px;color:#f6d9b0;margin-top:14px;padding-inline-start:.42em}
.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px;padding:0 200px}
.cover .arch{height:520px;aspect-ratio:4/5;border-radius:999px 999px 30px 30px;overflow:hidden;border:7px solid rgba(246,193,119,.5);box-shadow:0 30px 80px rgba(12,22,38,.45);flex:0 0 auto}
.cover .arch img{width:100%;height:100%;object-fit:cover;display:block}
.cover h1{color:#fff;font-family:var(--l-display);font-size:92px;line-height:1.25;margin:0}
.cover h1 span{display:block;color:#f6c177}
.cover p{font-size:32px;margin:18px 0 0;color:#e6e9f0}
.cover .chip{display:inline-block;padding:10px 24px;border-radius:999px;font-size:25px;font-weight:600;background:rgba(255,255,255,.12);color:#f6d9b0;border:1px solid rgba(246,193,119,.35);margin-bottom:22px}
</style></head><body><div class="stars"></div><script src="/tools/ads/page.js"></script></body></html>
