    </linearGradient>
    <linearGradient id="nile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3a46f"/><stop offset=".35" stop-color="#7b4466"/><stop offset="1" stop-color="#1c2747"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#25406a"/><stop offset="1" stop-color="#13233b"/></linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f1c30"/><stop offset="1" stop-color="#1a2f51"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e4d7c"/><stop offset="1" stop-color="#1b3256"/></linearGradient>
