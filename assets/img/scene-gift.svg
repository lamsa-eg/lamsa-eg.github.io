<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="t d">
  <title id="t">رسمة توضيحية لهدية لمسة</title>
  <desc id="d">علبة هدية كحلي بشريطة مشمشي وقطعة لمسة فيها NFC وQR أمام النيل وقت الغروب مع فلوكة والقمر.</desc>
  <defs>
