      <rect x="34" y="69" width="5" height="5" fill="#fff"/><rect x="59" y="69" width="5" height="5" fill="#fff"/><rect x="34" y="94" width="5" height="5" fill="#fff"/>
      <rect x="46" y="68" width="4" height="4"/><rect x="47" y="76" width="4" height="4"/><rect x="45" y="84" width="6" height="4"/><rect x="55" y="82" width="4" height="4"/><rect x="62" y="84" width="5" height="4"/><rect x="48" y="92" width="4" height="6"/><rect x="56" y="92" width="4" height="4"/><rect x="62" y="96" width="5" height="5"/><rect x="54" y="99" width="4" height="3"/><rect x="33" y="82" width="6" height="4"/>
