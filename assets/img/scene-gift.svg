    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#efe1c6"/></linearGradient>
    <radialGradient id="moon" cx=".4" cy=".4" r=".7"><stop offset="0" stop-color="#fff6e3"/><stop offset="1" stop-color="#f6d7a4"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f6c177" stop-opacity=".55"/><stop offset="1" stop-color="#f6c177" stop-opacity="0"/></radialGradient>
