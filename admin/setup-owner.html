<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>LAMSA — إعداد حساب المالك</title><link href="../assets/css/app.css" rel="stylesheet"/><link href="../assets/css/admin.css" rel="stylesheet"/><style>.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(470px,100%);padding:30px}.logo{height:68px;margin:0 auto 24px}.fields{display:grid;gap:13px}.note{margin-top:14px;color:#9c8e7e;font-size:11px;line-height:1.9}.result{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:13px;display:none;line-height:1.8;font-size:12px}</style><meta content="noindex,nofollow,noarchive" name="robots"/></head><body><div class="wrap"><form class="card box" id="form"><img alt="LAMSA" class="logo" src="../assets/img/logo.svg"/><span class="kicker">ONE-TIME OWNER SETUP</span><h1 style="font:34px Georgia;margin:8px 0 20px">إعداد حساب المالك</h1><div class="fields"><label class="field">الاسم<input id="name" maxlength="80" required="" value="مصطفى"/></label><label class="field">البريد الإلكتروني<input autocomplete="email" id="email" maxlength="254" required="" type="email"/></label><label class="field">كلمة المرور<input autocomplete="new-password" id="password" maxlength="128" minlength="12" required="" type="password"/></label><label class="field">كود التأسيس<input autocomplete="off" id="code" minlength="20" required="" type="password"/></label><button class="romantic-btn light">إنشاء Owner وإغلاق التأسيس</button></div><div class="note">هذه الصفحة تعمل مرة واحدة فقط. بعد إنشاء أول Owner يُغلق التأسيس من السيرفر تلقائيًا، ولا يوجد كود تأسيس داخل ملفات الموقع.</div><div class="result" id="result"></div><div style="margin-top:14px;text-align:center"><a class="muted small" href="login.html">العودة لتسجيل الدخول</a></div></form></div><script src="/env.js"></script><script src="../assets/js/config-cf-v4.js"></script><script type="module" src="../assets/js/admin-setup-owner.js"></script></body></html>
