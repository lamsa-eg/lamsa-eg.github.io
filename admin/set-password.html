<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لمسة — اختيار كلمة السر</title><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/css/lamsa-ds.css"><style>.sp{min-height:100vh;display:grid;place-items:center;padding:20px}.sp .l-card{width:100%;max-width:420px;padding:26px}</style></head>
<body class="l-body"><main class="sp"><form class="l-card" id="form" novalidate>
<h1 class="l-display" style="font-size:34px">أهلًا بيك في لمسة ✦</h1>
<p class="l-help" id="who">اختار كلمة سر لحساب الإدارة.</p>
<div class="l-field"><label for="pw">كلمة السر الجديدة (12 حرف على الأقل)</label><input class="l-input" id="pw" type="password" minlength="12" autocomplete="new-password" required dir="ltr"></div>
<div class="l-field"><label for="pw2">اكتبها تاني</label><input class="l-input" id="pw2" type="password" minlength="12" autocomplete="new-password" required dir="ltr"></div>
<p class="l-error" id="err" role="alert"></p>
<button class="l-btn l-btn-sun l-btn-block" type="submit" id="btn">حفظ والدخول للوحة الإدارة</button>
</form></main>
<script src="/env.js"></script><script src="/assets/js/config-cf-v4.js"></script><script type="module" src="/assets/js/admin-set-password.js"></script></body></html>
